<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1a4f8b" />
<title>Crystal Villa Booking</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --surface2: #f0ede6;
    --border: #e0dbd0;
    --text: #1a1714;
    --text2: #6b6560;
    --text3: #9e9890;
    --accent: #2c5f3f;
    --accent-light: #e8f2ec;
    --accent2: #8b4513;
    --blue: #1a4f8b;
    --blue-light: #e8f0f8;
    --gold: #c9963a;
    --gold-light: #fdf5e6;
    --danger: #8b1a1a;
    --danger-light: #fdf0f0;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 2px 16px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; }
  input, select, textarea, button { font-size: 16px; }
  button, .icon-btn, .tab-btn, .pay-btn, .icon-action, .table-action, .export-btn, .add-btn, .modal-close, .logout-btn { touch-action: manipulation; }

  /* LOGIN */
  #screen-login {
    background: linear-gradient(135deg, rgba(26,23,20,0.55) 0%, rgba(26,23,20,0.65) 100%), #1a4f8b
                url('https://media-cdn.tripadvisor.com/media/photo-s/26/96/50/60/crystal-villa.jpg') center/cover no-repeat;
    align-items: center; justify-content: center; padding: 2rem;
  }
  .login-container { width: 100%; max-width: 420px; }
  .login-brand { text-align: center; margin-bottom: 2.5rem; }
  .login-brand .icon { width: 64px; height: 64px; background: var(--accent); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 28px; }
  .login-brand h1 { font-family: 'DM Serif Display', serif; font-size: 2.8rem; color: #e8eaee; font-weight: 800; line-height: 1.1; }
  .login-brand p { font-size: 14px; color: #ffffff; margin-top: 6px; }
  .login-card { background: linear-gradient(135deg, #1a4f8b 0%, #2a6fa8 100%); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; box-shadow: var(--shadow); }
  .login-card h2 { font-size: 18px; font-weight: 600; margin-bottom: 1.5rem; color: #efefef; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; font-weight: 700; color: #ffffff; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .modal-box .form-group label { color: #1a1714; }
  .modal-box .form-section-title { color: #1a4f8b; border-bottom-color: #1a4f8b; font-size: 12px; }
  .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font-size: 16px; font-family: 'DM Sans', sans-serif; transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(44,95,63,0.1); }
  .btn { width: 100%; padding: 12px; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #1e4a2e; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(44,95,63,0.3); }
  .login-error { background: var(--danger-light); border: 1px solid #f5c0c0; border-radius: var(--radius-sm); color: var(--danger); font-size: 13px; padding: 10px 14px; margin-bottom: 14px; display: none; }
  .login-error.show { display: block; }
  .password-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
  .password-wrapper input { width: 100%; padding-right: 40px; }
  .show-password-btn { position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: var(--text2); font-size: 18px; padding: 4px 8px; display: flex; align-items: center; justify-content: center; }
  .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 12px; margin-bottom: 14px; }
  .checkbox-group input[type="checkbox"] { width: auto; cursor: pointer; accent-color: var(--accent); }
  .checkbox-group label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 400; text-transform: none; letter-spacing: normal; color: #ffffff; cursor: pointer; margin: 0; }

  /* APP LAYOUT */
  #screen-app { flex-direction: column; }
  .app-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; padding-top: env(safe-area-inset-top); display: flex; align-items: center; justify-content: space-between; min-height: 60px; position: sticky; top: 0; z-index: 50; gap: 10px; }
  .app-header .brand { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--accent); display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .user-badge { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--surface2); border-radius: 20px; font-size: 13px; font-weight: 500; }
  .user-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: white; }
  .logout-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px; background: transparent; color: var(--text2); font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; }
  .logout-btn:hover { background: var(--surface2); }
  .app-body { flex: 1; padding: 24px; max-width: 1200px; margin: 0 auto; width: 100%; }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .stat-card .s-label { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }
  .stat-card .s-val { font-size: 26px; font-weight: 600; color: var(--text); margin-top: 4px; font-family: 'DM Serif Display', serif; }
  .stat-card .s-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

  /* TABS */
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--surface2); padding: 4px; border-radius: var(--radius-sm); width: fit-content; flex-wrap: wrap; }
  .tab-btn { padding: 8px 18px; border: none; border-radius: 6px; background: transparent; color: var(--text2); font-size: 14px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.15s; }
  .tab-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

  /* TOP BAR */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .nav-btns { display: flex; align-items: center; gap: 8px; }
  .icon-btn { width: 34px; height: 34px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--text2); transition: all 0.15s; }
  .icon-btn:hover { background: var(--surface2); }
  .month-title { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--text); }
  .add-btn { padding: 8px 18px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s; }
  .add-btn:hover { background: #1e4a2e; }

  /* CALENDAR */
  .cal-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; box-shadow: var(--shadow); }
  .cal-table { width: 100%; border-collapse: collapse; min-width: 700px; }
  .cal-table th { padding: 10px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text2); background: var(--surface2); border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); text-align: center; white-space: nowrap; }
  .cal-table th:last-child { border-right: none; }
  .cal-table th.day-th { width: 52px; }
  .cal-table td { padding: 4px 5px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); vertical-align: middle; text-align: center; min-height: 38px; height: 38px; }
  .cal-table td:last-child { border-right: none; }
  .cal-table tr:last-child td { border-bottom: none; }
  .cal-table td.day-cell { font-size: 13px; font-weight: 500; color: var(--text2); background: var(--surface2); width: 52px; }
  .cal-table tr.today-row td.day-cell { color: var(--accent); font-weight: 700; background: var(--accent-light); }
  .room-td { cursor: pointer; transition: background 0.1s; }
  .room-td:hover { background: var(--surface2); }
  .pill { display: block; padding: 3px 6px; border-radius: 5px; font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; max-width: 100%; }
  .pill.upcoming { background: var(--blue-light); color: var(--blue); }
  .pill.active { background: var(--accent-light); color: var(--accent); }
  .pill.past { background: var(--surface2); color: var(--text3); }

  /* BOOKING LIST */
  .filter-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .filter-bar select { padding: 7px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none; cursor: pointer; }
  .bk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .bk-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); transition: box-shadow 0.15s; }
  .bk-card:hover { box-shadow: var(--shadow-lg); }
  .bk-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
  .bk-guest { font-size: 16px; font-weight: 600; color: var(--text); }
  .room-tag { font-size: 11px; padding: 3px 9px; border-radius: 10px; font-weight: 500; white-space: nowrap; }
  .bk-info { font-size: 13px; color: var(--text2); display: flex; flex-direction: column; gap: 4px; }
  .bk-info span { display: flex; align-items: center; gap: 6px; }
  .bk-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .price-tag { font-size: 18px; font-weight: 600; font-family: 'DM Serif Display', serif; color: var(--text); }
  .card-actions { display: flex; gap: 6px; }
  .icon-action { width: 30px; height: 30px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--text2); transition: all 0.15s; }
  .icon-action:hover { background: var(--surface2); color: var(--text); }
  .icon-action.del:hover { background: var(--danger-light); color: var(--danger); border-color: #f5c0c0; }
  .empty-state { text-align: center; padding: 3rem; color: var(--text2); }
  .empty-state .big { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,23,20,0.5); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: var(--surface); border-radius: var(--radius); padding: 1.75rem; width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; box-shadow: var(--shadow-lg); animation: slideUp 0.2s ease; }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  .modal-header h3 { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--text); }
  .modal-close { width: 32px; height: 32px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; cursor: pointer; font-size: 18px; color: var(--text2); display: flex; align-items: center; justify-content: center; }
  .modal-close:hover { background: var(--surface2); }
  .form-error { background: var(--danger-light); border: 1px solid #f5c0c0; color: var(--danger); font-size: 13px; padding: 8px 12px; border-radius: var(--radius-sm); margin-bottom: 12px; display: none; }
  .form-error.show { display: block; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; flex-wrap: wrap; }
  .btn-sm { padding: 9px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text2); transition: all 0.15s; }
  .btn-sm:hover { background: var(--surface2); }
  .btn-sm.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-sm.primary:hover { background: #1e4a2e; }
  .btn-sm.invoice { background: var(--blue); color: white; border-color: var(--blue); }
  .btn-sm.invoice:hover { background: #133a6b; }
  .nights-display { background: var(--accent-light); color: var(--accent); font-size: 13px; font-weight: 500; padding: 8px 12px; border-radius: var(--radius-sm); margin-top: 8px; display: none; }

  /* CURRENCY CONVERTER PANEL */
  .currency-panel { background: #f0f4ff; border: 1px solid #c5d3f0; border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 14px; }
  .currency-panel-title { font-size: 11px; font-weight: 700; color: #1a4f8b; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .currency-rate-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .rate-field { display: flex; flex-direction: column; gap: 3px; }
  .rate-field label { font-size: 10px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.04em; }
  .rate-field input, .rate-field select { padding: 6px 10px; border: 1px solid #c5d3f0; border-radius: 6px; background: white; color: #1a1714; font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none; }
  .rate-field input:focus { border-color: #1a4f8b; }
  .converted-display { background: #1a4f8b; color: white; border-radius: var(--radius-sm); padding: 8px 12px; margin-top: 8px; font-size: 13px; font-weight: 600; display: none; text-align: center; }

  /* PAYMENT METHOD */
  .payment-methods { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .pay-btn { flex: 1; min-width: 90px; padding: 8px 10px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: white; color: #1a1714; font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; text-align: center; transition: all 0.15s; }
  .pay-btn:hover { border-color: #1a4f8b; background: #f0f4ff; }
  .pay-btn.selected { border-color: #1a4f8b; background: #1a4f8b; color: white; }

  /* STATUS BADGES */
  .pay-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
  .status-dot { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 10px; }
  .status-dot.upcoming { background: var(--blue-light); color: var(--blue); }
  .status-dot.active { background: var(--accent-light); color: var(--accent); }
  .status-dot.past { background: var(--surface2); color: var(--text3); }

  /* FORM GRID */
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); border-bottom: 1px solid var(--border); padding-bottom: 6px; margin: 16px 0 10px; }

  /* EXPORT */
  .export-btn { padding: 8px 16px; background: var(--gold-light); color: var(--gold); border: 1px solid #f0d9a8; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s; }
  .export-btn:hover { background: #faecd6; }

  /* ADMIN PANEL */
  .admin-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
  .admin-section h4 { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--blue); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .user-table { width: 100%; border-collapse: collapse; }
  .user-table th { padding: 10px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); background: var(--surface2); border-bottom: 1px solid var(--border); text-align: left; }
  .user-table td { padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--border); color: var(--text); }
  .user-table tr:last-child td { border-bottom: none; }
  .role-badge { display: inline-flex; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .role-badge.admin { background: #fdf5e6; color: #c9963a; }
  .role-badge.staff { background: var(--blue-light); color: var(--blue); }
  .table-action { padding: 4px 12px; border: 1px solid var(--border); border-radius: 6px; background: transparent; cursor: pointer; font-size: 12px; font-family: 'DM Sans', sans-serif; color: var(--text2); transition: all 0.15s; }
  .table-action:hover { background: var(--surface2); }
  .table-action.del { color: var(--danger); }
  .table-action.del:hover { background: var(--danger-light); border-color: #f5c0c0; }

  /* AUDIT LOG */
  .audit-list { display: flex; flex-direction: column; gap: 8px; max-height: 400px; overflow-y: auto; }
  .audit-item { background: var(--surface2); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; display: flex; gap: 12px; align-items: flex-start; }
  .audit-icon { font-size: 18px; flex-shrink: 0; }
  .audit-body { flex: 1; }
  .audit-user { font-weight: 700; color: var(--blue); }
  .audit-time { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .audit-filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .audit-filter-bar select { padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: white; color: var(--text); font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none; }
 
  /* ADD USER FORM */
  .add-user-form { background: var(--surface2); border-radius: var(--radius-sm); padding: 16px; margin-top: 14px; }
  .add-user-form h5 { font-size: 13px; font-weight: 700; color: var(--blue); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .add-user-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: end; }
  .add-user-row input, .add-user-row select { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: white; color: var(--text); font-size: 14px; font-family: 'DM Sans', sans-serif; outline: none; width: 100%; }
  .add-user-row input:focus { border-color: var(--accent); }

  /* ACCESS DENIED */
  .access-denied { background: var(--danger-light); border: 1px solid #f5c0c0; color: var(--danger); border-radius: var(--radius); padding: 20px; text-align: center; font-size: 15px; }

  /* INVOICE PRINT */
  #invoice-modal .modal-box { max-width: 800px; }
  @page { size: A4 portrait; margin: 10mm; }
  @media print {
    html, body { width: 100%; height: auto !important; min-height: 0 !important; background: #fff !important; overflow: visible !important; margin: 0 !important; }
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }

    /* CRITICAL: fully remove the app screens and every OTHER modal from the print
       flow. Without this, #screen-app (min-height:100vh) and the closed booking /
       cancel / user modals still take up layout space (just invisible), which is
       what was pushing the invoice onto extra blank pages and misaligning it on A4. */
    #screen-login, #screen-app { display: none !important; }
    #modal-overlay, #cancel-modal, #user-modal { display: none !important; }

    /* IMPORTANT: static (not fixed) positioning — fixed elements paginate incorrectly
       on mobile browsers and cause a stray/blank second page. Only the invoice modal
       itself should be forced visible/in-flow for print. */
    #invoice-modal { position: static !important; display: block !important; overflow: visible !important; height: auto !important; min-height: 0 !important; background: none !important; padding: 0 !important; margin: 0 !important; }
    #invoice-modal .modal-box { position: static !important; max-width: 100% !important; width: 100% !important; max-height: none !important; overflow: visible !important; box-shadow: none !important; border: none !important; padding: 0 !important; margin: 0 !important; }
    #print-area { position: static !important; width: 100% !important; max-width: 100% !important; padding: 0 !important; margin: 0 !important; background: white; }

    /* Force the proper multi-column invoice layout for print, regardless of the
       phone's narrow screen width (mobile media queries below must not leak into print) */
    .invoice-wrap { font-size: 11px !important; line-height: 1.4 !important; width: 100% !important; }

    /* Keep related content together instead of splitting awkwardly across pages */

      page-break-inside: avoid; break-inside: avoid;
    }

  }

  .invoice-wrap { font-family: 'DM Sans', sans-serif; color: #1a1714; font-size: 12px; line-height: 1.5; }
  .inv-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1a4f8b; padding-bottom: 14px; margin-bottom: 14px; }
  .inv-logo-block { display: flex; align-items: center; gap: 12px; }
  .inv-logo-circle { width: 72px; height: 72px; border-radius: 50%; background: #1a4f8b; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .inv-logo-circle svg { width: 48px; height: 48px; }
  .inv-hotel-info h2 { font-family: 'DM Serif Display', serif; font-size: 18px; color: #1a4f8b; margin-bottom: 2px; }

  .inv-title-block { text-align: right; }
  .inv-title-block h3 { font-family: 'DM Serif Display', serif; font-size: 22px; color: #1a4f8b; margin-bottom: 4px; }

  .inv-section-title { background: #1a4f8b; color: white; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 10px; border-radius: 4px; margin-bottom: 8px; }
  .inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; }
  .inv-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px 20px; }
  .inv-field { display: flex; flex-direction: column; gap: 1px; }
  .inv-field label { font-size: 10px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.04em; }
  .inv-field span { font-size: 12px; color: #1a1714; font-weight: 500; border-bottom: 1px solid #ddd; padding-bottom: 2px; min-height: 18px; }
  .inv-charges-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  .inv-charges-table th { background: #f0ede6; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 5px 8px; border: 1px solid #ddd; text-align: left; }
  .inv-charges-table td { padding: 5px 8px; border: 1px solid #ddd; font-size: 12px; }
  .inv-total-row td { background: #e8f0f8; font-weight: 700; color: #1a4f8b; font-size: 13px; }
  .inv-sign-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 8px; }
  .inv-sign-box { border-top: 1px solid #999; padding-top: 4px; }
  .inv-sign-box label { font-size: 10px; font-weight: 700; color: #666; text-transform: uppercase; }
  .inv-sign-space { height: 48px; }
  .inv-terms { background: #f7f5f0; border: 1px solid #e0dbd0; border-radius: 4px; padding: 8px 12px; margin-top: 10px; }
  .inv-terms h4 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #1a4f8b; margin-bottom: 4px; }
  .inv-terms ol { padding-left: 16px; margin: 0; }
  .inv-terms ol li { font-size: 10px; color: #555; margin-bottom: 2px; line-height: 1.4; }
  .inv-footer { text-align: center; margin-top: 10px; font-size: 10px; color: #888; border-top: 1px solid #e0dbd0; padding-top: 8px; }
  .inv-amount-words { font-size: 11px; color: #444; font-style: italic; margin-top: 4px; }

  /* ═══════ RESPONSIVE / MOBILE ═══════ */
  @media (max-width: 768px) {
    .app-body { padding: 14px; }

    .stat-card { padding: 12px; }

    .topbar { flex-direction: column; align-items: stretch; }
    .topbar .nav-btns { justify-content: space-between; }
    .topbar > div[style*="display:flex"] { width: 100%; }
    .form-row { grid-template-columns: 1fr; }
    .currency-rate-grid { grid-template-columns: 1fr; }

    .bk-grid { grid-template-columns: 1fr; }

  @media (max-width: 480px) {

    .app-header { height: auto; min-height: 56px; padding: 8px 10px; }
    .app-header .brand { font-size: 15px; gap: 6px; }
    .app-header .brand svg { width: 26px; height: 26px; flex-shrink: 0; }

    .user-badge span#user-name-display { display: none; }

    .logout-btn { padding: 6px 10px; font-size: 12px; }
    .app-body { padding: 10px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .tabs { width: 100%; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
    .tab-btn { padding: 8px 12px; font-size: 13px; white-space: nowrap; }
    .month-title { font-size: 16px; }
    .add-btn, .export-btn { padding: 9px 14px; font-size: 13px; flex: 1; justify-content: center; }
    .topbar > div[style*="display:flex"] { flex-wrap: nowrap; }
    .cal-wrap { border-radius: var(--radius-sm); }
    .cal-table th, .cal-table td { padding: 3px 4px; font-size: 12px; }
    .modal-header h3 { font-size: 17px; }
    .form-section-title { font-size: 10px; margin: 12px 0 8px; }
    .currency-panel { padding: 10px; }
  }

  /* Invoice preview readability on small screens (screen only, not print) */
  @media (max-width: 700px) {
    #invoice-modal .modal-box { max-width: 100%; padding: 1rem; }
    .modal-header.no-print { flex-direction: column; align-items: stretch; gap: 10px; }
    .modal-header.no-print > div { display: flex; gap: 8px; }
    .modal-header.no-print .btn-sm { flex: 1; }
    .inv-header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .inv-title-block { text-align: left; }
    .inv-grid, .inv-grid-3 { grid-template-columns: 1fr 1fr; }
    .inv-sign-grid { grid-template-columns: 1fr; gap: 24px; }

  }

  @media (max-width: 420px) {
    .inv-grid, .inv-grid-3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="screen-login" class="screen active">
  <div class="login-container">
    <div class="login-brand">
      <div class="icon">🏨</div>
      <h1>CRYSTAL VILLA BOOKING</h1>
      <p>Room booking management system</p>
    </div>
    <div class="login-card">
      <h2>Sign in to your account</h2>
      <div id="login-error" class="login-error"></div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="inp-username" placeholder="Enter username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" id="inp-password" placeholder="Enter password" autocomplete="current-password" />
          <button type="button" class="show-password-btn" id="toggle-password" onclick="togglePasswordVisibility()" title="Show/Hide password">👁️</button>
        </div>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="save-password-check" />
        <label for="save-password-check">Save password</label>
      </div>
      <button class="btn btn-primary" onclick="loginWithPassword()">Sign in</button>
    </div>
  </div>
</div>

<!-- APP SCREEN -->
<div id="screen-app" class="screen">
  <header class="app-header">
    <div class="brand">
      <svg width="32" height="32" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="48" fill="none" stroke="#1a4f8b" stroke-width="3"/>
        <circle cx="50" cy="42" r="8" fill="none" stroke="#1a4f8b" stroke-width="2"/>
        <line x1="46" y1="42" x2="54" y2="42" stroke="#1a4f8b" stroke-width="2"/>
        <line x1="50" y1="38" x2="50" y2="46" stroke="#1a4f8b" stroke-width="2"/>
        <path d="M 30 50 Q 35 45 40 50 Q 45 55 50 50 Q 55 45 60 50 Q 65 55 70 50" fill="none" stroke="#1a4f8b" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="25" y1="62" x2="75" y2="62" stroke="#1a4f8b" stroke-width="2"/>
        <path d="M 20 80 Q 30 75 40 80 Q 50 85 60 80 Q 70 75 80 80 L 80 98 Q 50 88 20 98 Z" fill="#1a4f8b"/>
      </svg>
      CRYSTAL VILLA BOOKING
    </div>
    <div class="header-right">
      <div class="user-badge">
        <div class="user-avatar" id="user-avatar">P1</div>
        <span id="user-name-display">Partner 1</span>
        <span id="user-role-badge" style="font-size:10px;padding:1px 6px;border-radius:8px;background:#fdf5e6;color:#c9963a;font-weight:700;"></span>
      </div>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </header>

  <div class="app-body">
    <div class="stats-grid" id="stats-grid"></div>
    <div class="tabs" id="main-tabs">
      <button class="tab-btn active" onclick="switchTab('calendar', this)">📅 Calendar</button>
      <button class="tab-btn" onclick="switchTab('bookings', this)">📋 All Bookings</button>
      <button class="tab-btn admin-only-tab" onclick="switchTab('admin', this)" style="display:none;">⚙️ Admin</button>
      <button class="tab-btn admin-only-tab" onclick="switchTab('accounts', this)" style="display:none;">💼 Accounts</button>
    </div>



    <!-- Calendar Tab -->
    <div id="tab-calendar">
      <div class="topbar">
        <div class="nav-btns">
          <button class="icon-btn" onclick="navMonth(-1)">◀</button>
          <span class="month-title" id="cal-month-title"></span>
          <button class="icon-btn" onclick="navMonth(1)">▶</button>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <button class="export-btn" onclick="exportExcel()">📊 Export Excel</button>
          <button class="add-btn" onclick="openModal()">＋ Add Booking</button>
        </div>
      </div>
      <div class="cal-wrap">
        <table class="cal-table" id="cal-table"></table>
      </div>
    </div>

    <!-- Bookings Tab -->
    <div id="tab-bookings" style="display:none;">
      <div class="topbar">
        <div class="filter-bar">
          <select id="filter-room" onchange="renderBookingList()">
            <option value="">All rooms</option>
          </select>
          <select id="filter-status" onchange="renderBookingList()">
            <option value="">All statuses</option>
            <option value="upcoming">Upcoming</option>
            <option value="active">Active</option>
            <option value="past">Past</option>
          </select>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="export-btn" onclick="exportExcel()">📊 Export Excel</button>
          <button class="add-btn" onclick="openModal()">＋ Add Booking</button>
        </div>
      </div>
      <div id="booking-list-grid" class="bk-grid"></div>
    </div>

    <!-- Admin Tab (partner1 only) -->
    <div id="tab-admin" style="display:none;">
      <div id="admin-content"></div>
    </div>

    <!-- Accounts Tab (Admin only) -->
    <div id="tab-accounts" style="display:none;">
      <div id="accounts-content"></div>
    </div>
  </div>
</div>

<!-- BOOKING MODAL -->
<div id="modal-overlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">New Booking</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="form-error" class="form-error"></div>

    <div class="form-section-title">Guest Information</div>
    <div class="form-group">
      <label>Guest Name</label>
      <input type="text" id="f-guest" placeholder="Full name of guest" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Nationality</label>
        <input type="text" id="f-nationality" placeholder="e.g. Sri Lankan" />
      </div>
      <div class="form-group">
        <label>Passport / NIC No.</label>
        <input type="text" id="f-passport" placeholder="ID number" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="f-phone" placeholder="+94 77 000 0000" />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="text" id="f-email" placeholder="guest@email.com" />
      </div>
    </div>

    <div class="form-section-title">Booking Details</div>
    <div class="form-group">
      <label>Room</label>
      <select id="f-room">
        <option value="">Select a room</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>No. of Adults</label>
        <input type="number" id="f-adults" placeholder="1" min="1" max="10" />
      </div>
      <div class="form-group">
        <label>No. of Children</label>
        <input type="number" id="f-children" placeholder="0" min="0" max="10" oninput="updateChildAgeFields()" />
      </div>
    </div>

    <!-- Children age inputs -->
    <div id="children-ages-wrap" style="display:none;margin-bottom:12px;padding:12px;background:#f0f8ff;border:1px solid #c5d3f0;border-radius:8px;">
      <div style="font-size:11px;font-weight:700;color:#1a4f8b;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">👶 Children Ages</div>
      <div id="children-ages-grid" style="display:flex;flex-wrap:wrap;gap:10px;"></div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Check-in Date</label>
        <input type="date" id="f-checkin" oninput="updateNights()" />
      </div>
      <div class="form-group">
        <label>Check-out Date</label>
        <input type="date" id="f-checkout" oninput="updateNights()" />
      </div>
    </div>
    <div class="nights-display" id="nights-display"></div>
    <div class="form-row">
      <div class="form-group">
        <label>Meal Plan</label>
        <select id="f-meal">
          <option value="RO">RO – Room Only</option>
          <option value="BB">BB – Bed &amp; Breakfast</option>
          <option value="HB">HB – Half Board</option>
          <option value="FB">FB – Full Board</option>
          <option value="AI">AI – All Inclusive</option>
        </select>
      </div>
      <div class="form-group">
        <label>Booking Source</label>
        <select id="f-source">
          <option value="Direct">Direct</option>
          <option value="Walk-in">Walk-in</option>
          <option value="Booking.com">Booking.com</option>
          <option value="Company">Company</option>
          <option value="Complimentary">Complimentary</option>
        </select>
      </div>
    </div>

    <div class="form-section-title">💰 Pricing &amp; Currency</div>
    <div class="currency-panel">
      <div class="currency-panel-title">💱 Guest Type &amp; Pricing</div>
      <div class="form-group" style="margin-bottom:12px;">
        <label>Guest Type</label>
        <select id="f-guest-type" onchange="onGuestTypeChange()">
          <option value="foreign">🌍 Foreign Guest (needs conversion rate)</option>
          <option value="local">🇱🇰 Local Guest (LKR only, no conversion)</option>
        </select>
      </div>
      <div class="currency-rate-grid">
        <div class="rate-field">
          <label id="price-field-label">Rate / Night (USD $)</label>
          <input type="number" id="f-price-usd" placeholder="0.00" min="0" step="0.01" oninput="recalcFromUSD()" />
        </div>
        <div class="rate-field" id="guest-currency-field">
          <label>Guest Currency</label>
          <select id="f-currency" onchange="onCurrencyChange()">
            <option value="LKR" data-rate="320">🇱🇰 LKR – Sri Lankan Rupee</option>
            <option value="USD" data-rate="1">🇺🇸 USD – US Dollar</option>
            <option value="EUR" data-rate="0.93">🇪🇺 EUR – Euro</option>
            <option value="GBP" data-rate="0.79">🇬🇧 GBP – British Pound</option>
            <option value="AUD" data-rate="1.54">🇦🇺 AUD – Australian Dollar</option>
            <option value="CAD" data-rate="1.37">🇨🇦 CAD – Canadian Dollar</option>
            <option value="CHF" data-rate="0.90">🇨🇭 CHF – Swiss Franc</option>
            <option value="JPY" data-rate="149">🇯🇵 JPY – Japanese Yen</option>
            <option value="CNY" data-rate="7.24">🇨🇳 CNY – Chinese Yuan</option>
            <option value="INR" data-rate="83.5">🇮🇳 INR – Indian Rupee</option>
            <option value="SGD" data-rate="1.34">🇸🇬 SGD – Singapore Dollar</option>
            <option value="MYR" data-rate="4.72">🇲🇾 MYR – Malaysian Ringgit</option>
            <option value="AED" data-rate="3.67">🇦🇪 AED – UAE Dirham</option>
            <option value="SAR" data-rate="3.75">🇸🇦 SAR – Saudi Riyal</option>
            <option value="THB" data-rate="35.5">🇹🇭 THB – Thai Baht</option>
            <option value="RUB" data-rate="92">🇷🇺 RUB – Russian Ruble</option>
            <option value="KRW" data-rate="1330">🇰🇷 KRW – Korean Won</option>
            <option value="SEK" data-rate="10.4">🇸🇪 SEK – Swedish Krona</option>
            <option value="NOK" data-rate="10.6">🇳🇴 NOK – Norwegian Krone</option>
            <option value="DKK" data-rate="6.9">🇩🇰 DKK – Danish Krone</option>
          </select>
        </div>
        <div class="rate-field" id="exchange-rate-field">
          <label>Exchange Rate (1 USD =)</label>
          <input type="number" id="f-rate" placeholder="320" min="0.01" step="0.01" oninput="recalcFromRate()" />
        </div>
      </div>
      <div class="converted-display" id="converted-display"></div>
    </div>

    <div class="form-group">
      <label>Rate Per Night (USD $)</label>
      <input type="number" id="f-price" placeholder="0.00" min="0" step="0.01" oninput="syncUSDField()" />
    </div>

    <div class="form-section-title">💳 Payment Method</div>
    <div class="payment-methods">
      <button type="button" class="pay-btn" onclick="selectPayment('Cash')" id="pay-Cash">💵 Cash</button>
      <button type="button" class="pay-btn" onclick="selectPayment('Card')" id="pay-Card">💳 Card</button>
      <button type="button" class="pay-btn" onclick="selectPayment('Cheque')" id="pay-Cheque">📄 Cheque</button>
      <button type="button" class="pay-btn" onclick="selectPayment('Company')" id="pay-Company">🏢 Company</button>
      <button type="button" class="pay-btn" onclick="selectPayment('Complimentary')" id="pay-Complimentary">🎁 Free</button>
    </div>
    <input type="hidden" id="f-payment" value="" />

    <div class="form-group" style="margin-top:14px;">
      <label>Special Requests / Notes</label>
      <input type="text" id="f-notes" placeholder="Any special requirements..." />
    </div>

    <div class="modal-actions">
      <button class="btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn-sm invoice" id="print-btn" onclick="openInvoice()" style="display:none;">🖨️ Print / PDF</button>
      <button class="btn-sm primary" onclick="saveBooking()">Save Booking</button>
    </div>
  </div>
</div>

<!-- INVOICE MODAL -->
<div id="invoice-modal" class="modal-overlay" onclick="if(event.target===this)closeInvoice()">
  <div class="modal-box" style="max-width:800px;">
    <div class="modal-header no-print">
      <h3>Guest Registration &amp; Invoice</h3>
      <div style="display:flex;gap:8px;">
        <button class="btn-sm primary" id="download-pdf-btn" onclick="downloadInvoicePDF()">📥 Download PDF</button>
        <button class="btn-sm" onclick="printInvoice()">🖨️ Print</button>
        <button class="modal-close" onclick="closeInvoice()">✕</button>
      </div>
    </div>
    <div id="print-area"></div>
  </div>
</div>

<!-- CANCEL MODAL -->
<div id="cancel-modal" class="modal-overlay" onclick="if(event.target===this)closeCancelModal()">
  <div class="modal-box" style="max-width:440px;">
    <div class="modal-header">
      <h3>Cancel Booking</h3>
      <button class="modal-close" onclick="closeCancelModal()">✕</button>
    </div>
    <div id="cancel-form-error" class="form-error"></div>

<script>
// ═══════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════
//  FIREBASE (cloud sync — replaces localStorage as source of truth)
// ═══════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyDwMtoamAUg8tqn9G8I7PiczG-5NudI_RY",
  authDomain: "crystal-villa-booking.firebaseapp.com",
  projectId: "crystal-villa-booking",
  storageBucket: "crystal-villa-booking.firebasestorage.app",
  messagingSenderId: "617007863904",
  appId: "1:617007863904:web:1a23bd218d38f5fb38cb05",
  measurementId: "G-2KJXVFVPHR"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const stateDocRef = db.collection('appState').doc('main');

let lastSyncIso = null;
let persistTimer = null;
let suppressNextSnapshot = false; // avoids a flicker right after our own write

const EMPTY_STATE = { bookings: [], extraUsers: {}, auditLog: [], invoiceCounter: 0, invoiceLogo: null, accountsRate: 320 };
let accountsRate = 320;

function applyStateToLocal(d) {
  bookings = Array.isArray(d.bookings) ? d.bookings : [];
  extraUsers = d.extraUsers || {};
  auditLog = Array.isArray(d.auditLog) ? d.auditLog : [];
  invoiceCounter = d.invoiceCounter || 0;
  accountsRate = parseFloat(d.accountsRate) || 320;
  if (d.invoiceLogo) localStorage.setItem('cvInvoiceLogo', d.invoiceLogo);
  else localStorage.removeItem('cvInvoiceLogo');
}

// Pull the latest shared state down from Firestore and into local state.
async function loadData() {
  try {
    const snap = await stateDocRef.get();
    if (!snap.exists) {
      await stateDocRef.set(EMPTY_STATE);
      applyStateToLocal(EMPTY_STATE);
    } else {
      applyStateToLocal(snap.data());
    }
    lastSyncIso = new Date().toISOString();
  } catch (e) {
    console.error('Firebase load failed:', e);
    alert('Could not load data from Firebase. Check your internet connection or the firebaseConfig values in the code.');
    bookings = []; extraUsers = {}; auditLog = []; invoiceCounter = 0; accountsRate = 320;
  }
}

// Push current local state up to Firestore (debounced so rapid edits don't spam writes).
function persistState() {
  if (persistTimer) clearTimeout(persistTimer);
  persistTimer = setTimeout(async () => {
    try {
      const payload = {
        bookings, extraUsers, auditLog, invoiceCounter, accountsRate,
        invoiceLogo: localStorage.getItem('cvInvoiceLogo') || null,
      };
      suppressNextSnapshot = true;
      await stateDocRef.set(payload);
    } catch (e) {
      console.error('Firebase save failed:', e);
      alert('Could not save to Firebase. Your change is only on this device right now — check your internet connection.');
    }
  }, 400);
}

// Live updates from the OTHER device land here automatically.
function setupRealtimeSync() {
  stateDocRef.onSnapshot(snap => {
    if (!snap.exists) return;
    if (suppressNextSnapshot) { suppressNextSnapshot = false; return; }
    applyStateToLocal(snap.data());
    lastSyncIso = new Date().toISOString();
    if (!currentUser) return;
    renderCalendar(); renderStats();
    if (document.getElementById('tab-bookings').style.display !== 'none') renderBookingList();
    if (document.getElementById('tab-admin').style.display !== 'none') renderAdminPanel();
    if (document.getElementById('tab-accounts').style.display !== 'none') renderAccountsPanel();
  }, err => console.error('Firebase realtime error:', err));
}
setupRealtimeSync();

function syncNow() {
  loadData().then(() => {
    renderCalendar(); renderStats();
    if (document.getElementById('tab-bookings').style.display !== 'none') renderBookingList();
    if (document.getElementById('tab-admin').style.display !== 'none') renderAdminPanel();
    if (document.getElementById('tab-accounts').style.display !== 'none') renderAccountsPanel();
  });
}



const ROOMS = [
  { id: 'bungalow1', name: 'Bungalow 1',  type: 'Bungalow', color: '#e8f2ec', text: '#2c5f3f' },
  { id: 'bungalow2', name: 'Bungalow 2',  type: 'Bungalow', color: '#e8f2ec', text: '#2c5f3f' },
  { id: 'double1',   name: 'Double Room', type: 'Double',   color: '#e8f0f8', text: '#1a4f8b' },
  { id: 'triple1',   name: 'Triple 1',    type: 'Triple',   color: '#fdf5e6', text: '#c9963a' },
  { id: 'triple2',   name: 'Triple 2',    type: 'Triple',   color: '#fdf5e6', text: '#c9963a' },
];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MEAL_LABELS = { RO:'Room Only (RO)', BB:'Bed & Breakfast (BB)', HB:'Half Board (HB)', FB:'Full Board (FB)', AI:'All Inclusive (AI)' };

// Default built-in accounts (stored separately, cannot be deleted)
const BUILTIN_ACCOUNTS = {
  partner1: { password: 'villa@2026', name: 'Partner 1', color: '#2c5f3f', initials: 'P1', role: 'admin' },
  partner2: { password: 'villa@2026', name: 'Partner 2', color: '#1a4f8b', initials: 'P2', role: 'staff' },
};

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let currentUser = null;
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let editingId = null;
let bookings = [];
let auditLog = [];
let extraUsers = {}; // additional users created by admin
let invoiceCounter = 0; // persisted

// ═══════════════════════════════════════════════════════
//  STORAGE
// ═══════════════════════════════════════════════════════
// loadData() now lives in the FIREBASE section above — it pulls from the cloud instead of localStorage.
function saveBookings() { persistState(); }
function saveAuditLog() { persistState(); }
function saveExtraUsers() { persistState(); }
function saveInvoiceCounter() { persistState(); }
function saveAccountsRate() {
  if (!isAdmin()) return;
  const v = parseFloat(document.getElementById('accounts-rate-input').value);
  if (!v || v <= 0) { alert('Please enter a valid rate.'); return; }
  accountsRate = v;
  addAudit('set_accounts_rate', `Updated Accounts reference rate to 1 USD = ${v} LKR`, '💱');
  persistState();
  renderAccountsPanel();
}
function saveSession(u) { localStorage.setItem('cvSession', u); }
function loadSession() { return localStorage.getItem('cvSession'); }
function clearSession() { localStorage.removeItem('cvSession'); }

function saveCredentials(u, p) {
  const cb = document.getElementById('save-password-check');
  if (cb && cb.checked) localStorage.setItem('cvCreds', btoa(JSON.stringify({ u, p })));
  else localStorage.removeItem('cvCreds');
}
function loadSavedCredentials() {
  const s = localStorage.getItem('cvCreds');
  if (!s) return;
  try {
    const c = JSON.parse(atob(s));
    document.getElementById('inp-username').value = c.u || '';
    document.getElementById('inp-password').value = c.p || '';
    document.getElementById('save-password-check').checked = true;
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════
//  AUDIT
// ═══════════════════════════════════════════════════════
function addAudit(action, detail, icon='📝') {
  auditLog.unshift({
    id: 'au_' + Date.now(),
    user: currentUser ? currentUser.name : 'System',
    username: currentUser ? currentUser.username : 'system',
    action, detail, icon,
    ts: new Date().toISOString()
  });
  if (auditLog.length > 500) auditLog = auditLog.slice(0, 500);
  saveAuditLog();
}

// ═══════════════════════════════════════════════════════
//  ACCOUNTS
// ═══════════════════════════════════════════════════════
function getAllAccounts() {
  return { ...BUILTIN_ACCOUNTS, ...extraUsers };
}
function getAccount(username) {
  return BUILTIN_ACCOUNTS[username] || extraUsers[username] || null;
}

// ═══════════════════════════════════════════════════════
//  AUTH
// ═══════════════════════════════════════════════════════
function togglePasswordVisibility() {
  const inp = document.getElementById('inp-password');
  const btn = document.getElementById('toggle-password');
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁️'; }
}

function loginWithPassword() {
  const username = document.getElementById('inp-username').value.trim().toLowerCase();
  const password = document.getElementById('inp-password').value;
  const acc = getAccount(username);
  if (!acc) { showLoginError('Username not found.'); return; }
  if (acc.password !== password) { showLoginError('Incorrect password.'); return; }
  saveCredentials(username, password);
  doLogin(username, acc);
}

function showLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}

async function doLogin(username, acc) {
  currentUser = { username, ...acc };
  saveSession(username);
  const signInBtn = document.querySelector('.login-card .btn-primary');
  if (signInBtn) { signInBtn.disabled = true; signInBtn.textContent = 'Loading your data…'; }
  await loadData();
  if (signInBtn) { signInBtn.disabled = false; signInBtn.textContent = 'Sign in'; }
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('screen-app').classList.add('active');
  document.getElementById('user-name-display').textContent = acc.name;
  const av = document.getElementById('user-avatar');
  av.textContent = acc.initials || username.substring(0,2).toUpperCase();
  av.style.background = acc.color || '#1a4f8b';
  const rb = document.getElementById('user-role-badge');
  rb.textContent = acc.role === 'admin' ? 'ADMIN' : 'STAFF';
  rb.style.background = acc.role === 'admin' ? '#fdf5e6' : '#e8f0f8';
  rb.style.color = acc.role === 'admin' ? '#c9963a' : '#1a4f8b';
  // Show admin tab only for admin
  document.querySelectorAll('.admin-only-tab').forEach(t => {
    t.style.display = isAdmin() ? '' : 'none';
  });
  populateSelects();
  renderStats();
  renderCalendar();
  addAudit('login', `Signed in`, '🔑');
}

function logout() {
  addAudit('logout', 'Signed out', '🚪');
  currentUser = null; clearSession();
  document.getElementById('screen-app').classList.remove('active');
  document.getElementById('screen-login').classList.add('active');
  document.getElementById('inp-password').value = '';
  // Reset tabs
  switchTab('calendar', document.querySelector('.tab-btn'));
}

function isAdmin() { return currentUser && currentUser.role === 'admin'; }

// ═══════════════════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════════════════
function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('tab-calendar').style.display = tab === 'calendar' ? '' : 'none';
  document.getElementById('tab-bookings').style.display = tab === 'bookings' ? '' : 'none';
  document.getElementById('tab-admin').style.display = tab === 'admin' ? '' : 'none';
  document.getElementById('tab-accounts').style.display = tab === 'accounts' ? '' : 'none';
  if (tab === 'bookings') renderBookingList();
  if (tab === 'admin') renderAdminPanel();
  if (tab === 'accounts') renderAccountsPanel();
}

// ═══════════════════════════════════════════════════════
//  STATS
// ═══════════════════════════════════════════════════════
function renderStats() {
  const today = todayStr();
  const active = bookings.filter(b => b.checkIn <= today && b.checkOut > today).length;
  const upcoming = bookings.filter(b => b.checkIn > today).length;
  const m = `${calYear}-${pad(calMonth+1)}`;
  const monthBookings = bookings.filter(b => b.checkIn.startsWith(m));
  const revLKR = monthBookings.filter(b => b.guestType === 'local').reduce((s,b) => s + (parseFloat(b.price)||0) * daysBetween(b.checkIn, b.checkOut), 0);
  const revUSD = monthBookings.filter(b => b.guestType !== 'local').reduce((s,b) => s + (parseFloat(b.price)||0) * daysBetween(b.checkIn, b.checkOut), 0);
  const totalNights = monthBookings.reduce((s,b) => s + daysBetween(b.checkIn, b.checkOut), 0);
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="s-label">Rooms</div><div class="s-val">5</div><div class="s-sub">2 bungalow · 1 double · 2 triple</div></div>
    <div class="stat-card"><div class="s-label">Currently active</div><div class="s-val">${active}</div><div class="s-sub">guests checked in</div></div>
    <div class="stat-card"><div class="s-label">Upcoming</div><div class="s-val">${upcoming}</div><div class="s-sub">future bookings</div></div>
    <div class="stat-card"><div class="s-label">${MONTHS[calMonth]} revenue (Local)</div><div class="s-val">Rs ${Math.round(revLKR).toLocaleString()}</div><div class="s-sub">${totalNights} nights booked</div></div>
    <div class="stat-card"><div class="s-label">${MONTHS[calMonth]} revenue (Foreign)</div><div class="s-val">$${Math.round(revUSD).toLocaleString()}</div><div class="s-sub">${totalNights} nights booked</div></div>
  `;
}

// ═══════════════════════════════════════════════════════
//  CALENDAR
// ═══════════════════════════════════════════════════════
function navMonth(dir) {
  calMonth += dir;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar(); renderStats();
}

function renderCalendar() {
  document.getElementById('cal-month-title').textContent = `${MONTHS[calMonth]} ${calYear}`;
  const days = daysInMonth(calYear, calMonth);
  const today = new Date();
  const todayDay = today.getFullYear()===calYear && today.getMonth()===calMonth ? today.getDate() : -1;
  let html = '<thead><tr><th class="day-th">Day</th>';
  ROOMS.forEach(r => { html += `<th>${r.name}<br><span style="font-weight:400;font-size:10px;text-transform:none;letter-spacing:0">${r.type}</span></th>`; });
  html += '</tr></thead><tbody>';
  for (let d = 1; d <= days; d++) {
    const dateStr = `${calYear}-${pad(calMonth+1)}-${pad(d)}`;
    const isToday = d === todayDay;
    html += `<tr class="${isToday?'today-row':''}"><td class="day-cell">${d}</td>`;
    ROOMS.forEach(r => {
      const bk = bookingOn(r.id, dateStr);
      if (bk) {
        const status = getStatus(bk);
        html += `<td class="room-td"><span class="pill ${status}" onclick="openEditModal('${bk.id}')">${bk.guestName.split(' ')[0]}</span></td>`;
      } else {
        html += `<td class="room-td" onclick="quickAdd('${dateStr}','${r.id}')"></td>`;
      }
    });
    html += '</tr>';
  }
  html += '</tbody>';
  document.getElementById('cal-table').innerHTML = html;
}

// ═══════════════════════════════════════════════════════
//  BOOKING LIST
// ═══════════════════════════════════════════════════════
function renderBookingList() {
  const filterRoom = document.getElementById('filter-room').value;
  const filterStatus = document.getElementById('filter-status').value;
  let list = [...bookings].sort((a,b) => a.checkIn.localeCompare(b.checkIn));
  if (filterRoom) list = list.filter(b => b.room === filterRoom);
  if (filterStatus) list = list.filter(b => getStatus(b) === filterStatus);
  const grid = document.getElementById('booking-list-grid');
  if (list.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="big">🛏️</div><p>No bookings found</p></div>`;
    return;
  }
  grid.innerHTML = list.map(b => {
    const room = ROOMS.find(r => r.id === b.room) || { name:'Unknown', color:'#eee', text:'#333' };
    const status = getStatus(b);
    const nights = daysBetween(b.checkIn, b.checkOut);
    const total = (parseFloat(b.price)||0) * nights;
    const canEdit = isAdmin();
    return `
    <div class="bk-card">
      <div class="bk-card-top">
        <div class="bk-guest">${b.guestName}</div>
        <span class="room-tag" style="background:${room.color};color:${room.text}">${room.name}</span>
      </div>
      <div class="bk-info">
        <span>📅 ${fmtDate(b.checkIn)} → ${fmtDate(b.checkOut)}</span>
        <span>🌙 ${nights} night${nights!==1?'s':''}</span>
        ${b.mealPlan ? `<span>🍽️ ${MEAL_LABELS[b.mealPlan]||b.mealPlan}</span>` : ''}
        ${b.source ? `<span>📌 ${b.source}</span>` : ''}
        <span><span class="status-dot ${status}">● ${status.charAt(0).toUpperCase()+status.slice(1)}</span></span>
        <span style="font-size:11px;color:var(--text3);">Added by: ${b.addedBy||'—'}</span>
      </div>
      <div class="bk-footer">
        <div>
          <div class="price-tag">${b.guestType==='local'?'Rs ':'$'}${total.toLocaleString(undefined,{maximumFractionDigits:2})}</div>
          <div style="font-size:11px;color:var(--text3);">${b.guestType==='local'?'Rs ':'$'}${(parseFloat(b.price)||0).toFixed(2)}/night × ${nights}</div>
        </div>
        <div class="card-actions">
          <button class="icon-action" title="Print Invoice" onclick="openInvoiceById('${b.id}')">🖨️</button>
          <button class="icon-action del" title="Cancel" onclick="openCancelModal('${b.id}')">⛔</button>
          ${canEdit ? `<button class="icon-action" title="Edit" onclick="openEditModal('${b.id}')">✏️</button>
          <button class="icon-action del" title="Delete" onclick="deleteBooking('${b.id}')">🗑️</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════
//  ADMIN PANEL
// ═══════════════════════════════════════════════════════
function renderAdminPanel() {
  if (!isAdmin()) {
    document.getElementById('admin-content').innerHTML = `<div class="access-denied">🚫 Access Denied — Admin only</div>`;
    return;
  }
  const allAccounts = getAllAccounts();

  const logoData = localStorage.getItem('cvInvoiceLogo') || '';
  const logoPreview = logoData
    ? `<img src="${logoData}" style="max-width:120px;max-height:60px;border:1px solid var(--border);border-radius:8px;object-fit:contain;background:white;"/>`
    : `<div style="font-size:12px;color:var(--text3);">No logo set</div>`;

  const logoSection = `
    <div class="admin-section">
      <h4>🧾 Invoice Logo (Admin)</h4>
      <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;">
        <div>${logoPreview}</div>
        <div style="flex:1;min-width:240px;">
          <div class="form-group" style="margin:0 0 12px;">
            <label style="color:var(--text2);font-size:12px;text-transform:none;letter-spacing:normal;font-weight:700;display:block;margin-bottom:6px;">Upload Logo Image (PNG/JPG/SVG)</label>
            <input type="file" id="inv-logo-upload" accept="image/*" style="width:100%;" />
          </div>
          <div class="modal-actions" style="justify-content:flex-start;">
            <button class="btn-sm primary" onclick="saveInvoiceLogoFromFile()">Save Logo</button>
            <button class="btn-sm" onclick="clearInvoiceLogo()">Remove Logo</button>
          </div>
          <div style="font-size:12px;color:var(--text3);margin-top:10px;">Saved into browser localStorage for this device.</div>
        </div>
      </div>
    </div>`;
  const userRows = Object.entries(allAccounts).map(([uname, acc]) => {
    const isBuiltin = !!BUILTIN_ACCOUNTS[uname];
    return `<tr>
      <td><div style="display:flex;align-items:center;gap:8px;">
        <div style="width:28px;height:28px;border-radius:50%;background:${acc.color||'#1a4f8b'};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white;">${acc.initials||uname.substring(0,2).toUpperCase()}</div>
        <div><div style="font-weight:600;">${acc.name}</div><div style="font-size:12px;color:var(--text3);">@${uname}</div></div>
      </div></td>
      <td><span class="role-badge ${acc.role==='admin'?'admin':'staff'}">${acc.role==='admin'?'Admin':'Staff'}</span></td>
      <td>${isBuiltin ? '<span style="font-size:11px;color:var(--text3);">Built-in</span>' : `<button class="table-action" onclick="editUser('${uname}')">Edit</button>`}</td>
      <td>${(!isBuiltin && uname !== currentUser.username) ? `<button class="table-action del" onclick="removeUser('${uname}')">Remove</button>` : '<span style="font-size:11px;color:var(--text3);">—</span>'}</td>
    </tr>`;
  }).join('');

  // Audit filter
  const auditUserFilter = document.getElementById('aud-user-filter') ? document.getElementById('aud-user-filter').value : '';
  const auditActionFilter = document.getElementById('aud-action-filter') ? document.getElementById('aud-action-filter').value : '';
  let filteredAudit = [...auditLog];
  if (auditUserFilter) filteredAudit = filteredAudit.filter(a => a.username === auditUserFilter);
  if (auditActionFilter) filteredAudit = filteredAudit.filter(a => a.action === auditActionFilter);

  const auditUserOptions = [...new Set(auditLog.map(a => a.username))].map(u =>

let editingUsername = null;

function openAddUserModal() {
  editingUsername = null;
  document.getElementById('user-modal-title').textContent = 'Add New User';
  document.getElementById('uf-name').value = '';
  document.getElementById('uf-username').value = '';
  document.getElementById('uf-password').value = '';
  document.getElementById('uf-role').value = 'staff';
  document.getElementById('uf-initials').value = '';
  document.getElementById('uf-color').value = '#1a4f8b';
  document.getElementById('user-form-error').classList.remove('show');
  document.getElementById('user-modal').classList.add('open');
}

function editUser(username) {
  const acc = extraUsers[username];
  if (!acc) return;
  editingUsername = username;
  document.getElementById('user-modal-title').textContent = 'Edit User';
  document.getElementById('uf-name').value = acc.name || '';
  document.getElementById('uf-username').value = username;
  document.getElementById('uf-password').value = acc.password || '';
  document.getElementById('uf-role').value = acc.role || 'staff';
  document.getElementById('uf-initials').value = acc.initials || '';
  document.getElementById('uf-color').value = acc.color || '#1a4f8b';
  document.getElementById('user-form-error').classList.remove('show');
  document.getElementById('user-modal').classList.add('open');
}

function closeUserModal() { document.getElementById('user-modal').classList.remove('open'); editingUsername = null; }

function saveUser() {
  const name = document.getElementById('uf-name').value.trim();
  const username = document.getElementById('uf-username').value.trim().toLowerCase();
  const password = document.getElementById('uf-password').value;
  const role = document.getElementById('uf-role').value;
  const initials = document.getElementById('uf-initials').value.trim() || username.substring(0,2).toUpperCase();
  const color = document.getElementById('uf-color').value;

  if (!name) { showUserFormError('Name is required.'); return; }
  if (!username) { showUserFormError('Username is required.'); return; }
  if (!/^[a-z0-9_]+$/.test(username)) { showUserFormError('Username: lowercase letters, numbers, underscores only.'); return; }
  if (password.length < 6) { showUserFormError('Password must be at least 6 characters.'); return; }
  if (!editingUsername && (BUILTIN_ACCOUNTS[username] || extraUsers[username])) { showUserFormError('Username already exists.'); return; }

  const userData = { name, password, role, initials, color };
  if (editingUsername) {
    extraUsers[editingUsername] = { ...extraUsers[editingUsername], ...userData };
    addAudit('edit_user', `Edited user @${editingUsername}`, '✏️');
  } else {
    extraUsers[username] = userData;
    addAudit('add_user', `Added new user @${username} (${role})`, '👤');
  }
  saveExtraUsers();
  closeUserModal();
  renderAdminPanel();
}

function showUserFormError(msg) {
  const el = document.getElementById('user-form-error');
  el.textContent = msg; el.classList.add('show');
}

function removeUser(username) {
  if (!confirm(`Remove user @${username}? This cannot be undone.`)) return;
  addAudit('remove_user', `Removed user @${username}`, '🗑️');
  delete extraUsers[username];
  saveExtraUsers();
  renderAdminPanel();
}

function renderAccountsPanel() {
  if (!isAdmin()) {
    document.getElementById('accounts-content').innerHTML = `<div class="access-denied">🚫 Access Denied — Admin only</div>`;
    return;
  }
  const m = `${calYear}-${pad(calMonth+1)}`;
  const monthBookings = bookings.filter(b => b.checkIn.startsWith(m)).sort((a,b) => a.checkIn.localeCompare(b.checkIn));

  let totalGrossLKR = 0, totalGrossUSD = 0;
  let totalCardFeeLKR = 0, totalCardFeeUSD = 0;
  let totalNetLKR = 0, totalNetUSD = 0;

  const rows = monthBookings.map(b => {
    const room = ROOMS.find(r => r.id === b.room) || { name: b.room };
    const nights = daysBetween(b.checkIn, b.checkOut);
    const gross = (parseFloat(b.price)||0) * nights;
    const isLocal = b.guestType === 'local';
    const cardFee = b.paymentMethod === 'Card' ? gross * 0.025 : 0;
    const net = gross - cardFee;
    const vatServiceAmt = gross - (gross / 1.18);

    if (isLocal) { totalGrossLKR += gross; totalCardFeeLKR += cardFee; totalNetLKR += net; }
    else { totalGrossUSD += gross; totalCardFeeUSD += cardFee; totalNetUSD += net; }

    const grossLKR = isLocal ? gross : gross * accountsRate;
    const grossUSD = isLocal ? gross / accountsRate : gross;
    const vatServiceLKR = isLocal ? vatServiceAmt : vatServiceAmt * accountsRate;
    const vatServiceUSD = isLocal ? vatServiceAmt / accountsRate : vatServiceAmt;
    const cardFeeLKR = isLocal ? cardFee : cardFee * accountsRate;
    const cardFeeUSD = isLocal ? cardFee / accountsRate : cardFee;
    const netLKR = isLocal ? net : net * accountsRate;
    const netUSD = isLocal ? net / accountsRate : net;
    const dual = (lkr, usd) => `Rs ${lkr.toLocaleString(undefined,{maximumFractionDigits:2})}<br><span style="color:var(--text3);font-size:11px;">$${usd.toLocaleString(undefined,{maximumFractionDigits:2})}</span>`;

    return `<tr>
      <td>${b.guestName}</td>
      <td>${room.name}</td>
      <td><span class="role-badge ${isLocal?'staff':'admin'}">${isLocal?'Local':'Foreign'}</span></td>
      <td>${payIcon(b.paymentMethod)} ${b.paymentMethod||'—'}</td>
      <td style="text-align:right;">${dual(grossLKR, grossUSD)}</td>
      <td style="text-align:right;color:var(--text3);font-size:12px;">${dual(vatServiceLKR, vatServiceUSD)}</td>
      <td style="text-align:right;color:var(--text3);font-size:12px;">${cardFee>0 ? dual(cardFeeLKR, cardFeeUSD) : '—'}</td>
      <td style="text-align:right;font-weight:600;">${dual(netLKR, netUSD)}</td>
      <td><button class="icon-action" title="Print Accounts Invoice" onclick="openAccountsInvoiceById('${b.id}')">🖨️</button></td>
    </tr>`;
  }).join('') || `<tr><td colspan="9" style="text-align:center;color:var(--text3);padding:20px;">No bookings for ${MONTHS[calMonth]} ${calYear}</td></tr>`;

  document.getElementById('accounts-content').innerHTML = `
    <div class="stats-grid" style="margin-bottom:20px;">
      <div class="stat-card"><div class="s-label">${MONTHS[calMonth]} Gross Revenue (Local)</div><div class="s-val">Rs ${Math.round(totalGrossLKR).toLocaleString()}</div></div>
      <div class="stat-card"><div class="s-label">${MONTHS[calMonth]} Gross Revenue (Foreign)</div><div class="s-val">$${Math.round(totalGrossUSD).toLocaleString()}</div></div>
      <div class="stat-card"><div class="s-label">Card Fees Deducted (2.5%)</div><div class="s-val">Rs ${Math.round(totalCardFeeLKR).toLocaleString()}</div><div class="s-sub">$${totalCardFeeUSD.toFixed(2)} (foreign card fees)</div></div>
      <div class="stat-card"><div class="s-label">Net to Bank</div><div class="s-val">Rs ${Math.round(totalNetLKR).toLocaleString()}</div><div class="s-sub">$${Math.round(totalNetUSD).toLocaleString()} (foreign)</div></div>
    </div>
    <div class="admin-section">
      <h4>🏦 Bank Deposit Summary — Reference rate 1 USD = ${accountsRate} LKR</h4>
      <div style="font-size:13px;color:var(--text2);line-height:1.9;">
        Combined Net to Bank, all in LKR: <strong>Rs ${Math.round(totalNetLKR + totalNetUSD*accountsRate).toLocaleString()}</strong><br>
        Combined Net to Bank, all in USD: <strong>$${Math.round(totalNetUSD + totalNetLKR/accountsRate).toLocaleString()}</strong><br>
        <span style="font-size:12px;color:var(--text3);">(Local guest bookings are collected in LKR; foreign guest bookings are collected in USD. This just shows both totals side by side using the reference rate above — set it in Admin → Accounts Settings.)</span>
      </div>
    </div>
    <div class="admin-section">
      <h4>📊 ${MONTHS[calMonth]} ${calYear} — Booking Breakdown</h4>
      <div style="font-size:12px;color:var(--text3);margin-bottom:8px;">Amounts shown as LKR (with USD equivalent below) — reference rate 1 USD = ${accountsRate} LKR.</div>
      <div style="overflow-x:auto;">
        <table class="user-table">
          <thead><tr>
            <th>Guest</th><th>Room</th><th>Type</th><th>Payment</th>
            <th style="text-align:right;">Gross (LKR / USD)</th>
            <th style="text-align:right;">VAT/Service (18%)</th>
            <th style="text-align:right;">Card Fee (2.5%)</th>
            <th style="text-align:right;">Net to Bank</th>
            <th>Print</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="margin-top:14px;">
        <button class="export-btn" onclick="exportAccountsCSV()">📊 Export Accounts CSV</button>
      </div>
    </div>
  `;
}

function exportAccountsCSV() {
  if (!isAdmin()) return;
  const m = `${calYear}-${pad(calMonth+1)}`;
  const monthBookings = bookings.filter(b => b.checkIn.startsWith(m)).sort((a,b) => a.checkIn.localeCompare(b.checkIn));
  const rows = [['Guest Name','Guest Type','Room','Payment Method','Currency','Gross Amount','VAT & Service (18% Incl.)','Card Fee (2.5%)','Net to Bank','Check-in','Check-out']];
  monthBookings.forEach(b => {
    const room = ROOMS.find(r => r.id === b.room) || { name: b.room };
    const nights = daysBetween(b.checkIn, b.checkOut);
    const gross = (parseFloat(b.price)||0) * nights;
    const isLocal = b.guestType === 'local';
    const cardFee = b.paymentMethod === 'Card' ? gross * 0.025 : 0;
    const net = gross - cardFee;
    const vatServiceAmt = gross - (gross / 1.18);
    rows.push([b.guestName, isLocal?'Local':'Foreign', room.name, b.paymentMethod||'', isLocal?'LKR':'USD', gross.toFixed(2), vatServiceAmt.toFixed(2), cardFee.toFixed(2), net.toFixed(2), b.checkIn, b.checkOut]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = `crystal-villa-accounts-${MONTHS[calMonth]}-${calYear}.csv`; a.click();
  URL.revokeObjectURL(url);
  addAudit('export', `Exported Accounts CSV for ${MONTHS[calMonth]} ${calYear}`, '📊');
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); editingId = null; }

function updateNights() {
  const ci = document.getElementById('f-checkin').value;
  const co = document.getElementById('f-checkout').value;
  const el = document.getElementById('nights-display');
  if (ci && co && co > ci) {
    const n = daysBetween(ci, co);
    const rate = parseFloat(document.getElementById('f-price-usd').value) || parseFloat(document.getElementById('f-price').value) || 0;
    const total = rate * n;
    const sym = document.getElementById('f-guest-type').value === 'local' ? 'Rs ' : '$';
    el.innerHTML = `🌙 <strong>${n} night${n!==1?'s':''}</strong>${rate > 0 ? ` &nbsp;·&nbsp; ${sym}${rate.toFixed(2)}/night × ${n} = <strong>${sym}${total.toFixed(2)}</strong>` : ''}`;
    el.style.display = 'block';
  } else { el.style.display = 'none'; }
}

function saveBooking() {
  const guestName = document.getElementById('f-guest').value.trim();
  const room = document.getElementById('f-room').value;
  const checkIn = document.getElementById('f-checkin').value;
  const checkOut = document.getElementById('f-checkout').value;
  const price = document.getElementById('f-price').value;

  if (!guestName) { showFormError('Guest name is required.'); return; }
  if (!room) { showFormError('Please select a room.'); return; }
  if (!checkIn) { showFormError('Check-in date is required.'); return; }
  if (!checkOut) { showFormError('Check-out date is required.'); return; }
  if (checkOut <= checkIn) { showFormError('Check-out must be after check-in.'); return; }

  const overlap = bookings.find(b => b.room === room && b.id !== editingId && b.checkIn < checkOut && b.checkOut > checkIn);
  if (overlap) { showFormError(`Room already booked by ${overlap.guestName} (${fmtDate(overlap.checkIn)} – ${fmtDate(overlap.checkOut)}).`); return; }

  const bookingData = {
    guestName, nationality: document.getElementById('f-nationality').value.trim(),
    passport: document.getElementById('f-passport').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    email: document.getElementById('f-email').value.trim(),
    room, checkIn, checkOut,
    adults: document.getElementById('f-adults').value || '1',
    children: document.getElementById('f-children').value || '0',
    childrenAges: getChildrenAges(),
    mealPlan: document.getElementById('f-meal').value,
    source: document.getElementById('f-source').value,
    price: parseFloat(price) || 0,
    guestType: document.getElementById('f-guest-type').value,
    currency: document.getElementById('f-currency').value,
    exchangeRate: parseFloat(document.getElementById('f-rate').value) || 320,
    paymentMethod: document.getElementById('f-payment').value,
    notes: document.getElementById('f-notes').value.trim(),
  };

  if (editingId) {
    const idx = bookings.findIndex(b => b.id === editingId);
    bookings[idx] = { ...bookings[idx], ...bookingData, updatedBy: currentUser.name, updatedAt: new Date().toISOString() };
    addAudit('edit_booking', `Edited booking for ${guestName} (${fmtDate(checkIn)} – ${fmtDate(checkOut)})`, '✏️');
  } else {
    const newId = 'bk_' + Date.now();
    invoiceCounter++;
    saveInvoiceCounter();
    bookings.push({ id: newId, invNum: invoiceCounter, ...bookingData, addedBy: currentUser.name, addedAt: new Date().toISOString() });
    editingId = newId;
    addAudit('add_booking', `Added booking for ${guestName} — ${ROOMS.find(r=>r.id===room)?.name||room} (${fmtDate(checkIn)} – ${fmtDate(checkOut)})`, '➕');
  }
  saveBookings();
  renderCalendar(); renderStats();
  if (document.getElementById('tab-bookings').style.display !== 'none') renderBookingList();
  document.getElementById('print-btn').style.display = 'inline-flex';
  document.getElementById('modal-title').textContent = '✅ Booking Saved';
}

function deleteBooking(id) {
  if (!isAdmin()) { alert('Only admin can delete bookings.'); return; }
  const b = bookings.find(x => x.id === id);
  if (!confirm('Delete this booking? This cannot be undone.')) return;
  addAudit('delete_booking', `Deleted booking for ${b ? b.guestName : id}`, '🗑️');
  bookings = bookings.filter(b => b.id !== id);
  saveBookings(); renderCalendar(); renderStats(); renderBookingList();
}

function showFormError(msg) {
  const el = document.getElementById('form-error');
  el.textContent = msg; el.classList.add('show');
}

function updateChildAgeFields() {
  const count = parseInt(document.getElementById('f-children').value) || 0;
  const wrap = document.getElementById('children-ages-wrap');
  const grid = document.getElementById('children-ages-grid');
  if (count <= 0) { wrap.style.display = 'none'; grid.innerHTML = ''; return; }
  wrap.style.display = 'block';
  const existing = [];
  grid.querySelectorAll('input').forEach(inp => existing.push(inp.value));
  grid.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;flex-direction:column;gap:4px;';
    div.innerHTML = `
      <label style="font-size:10px;font-weight:700;color:#1a4f8b;text-transform:uppercase;">Child ${i+1} Age</label>
      <input id="child-age-${i}" type="number" min="0" max="17" placeholder="yrs" value="${existing[i]||''}"
        style="padding:7px 10px;border:1px solid #c5d3f0;border-radius:6px;background:white;color:#1a1714;font-size:14px;font-family:'DM Sans',sans-serif;width:90px;outline:none;text-align:center;" />`;
    grid.appendChild(div);
  }
}

function getChildrenAges() {
  const count = parseInt(document.getElementById('f-children').value) || 0;
  const ages = [];
  for (let i = 0; i < count; i++) {
    const inp = document.getElementById('child-age-' + i);
    ages.push(inp && inp.value !== '' ? parseInt(inp.value) : '?');
  }
  return ages;
}
