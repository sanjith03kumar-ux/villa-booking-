function onGuestTypeChange() {
  const isLocal = document.getElementById('f-guest-type').value === 'local';
  document.getElementById('guest-currency-field').style.display = isLocal ? 'none' : '';
  document.getElementById('exchange-rate-field').style.display = isLocal ? 'none' : '';
  document.getElementById('price-field-label').textContent = isLocal ? 'Rate / Night (LKR)' : 'Rate / Night (USD $)';
  if (isLocal) {
    document.getElementById('f-currency').value = 'LKR';
    document.getElementById('f-rate').value = '1';
    document.getElementById('converted-display').style.display = 'none';
  } else {
    if (document.getElementById('f-rate').value === '1') document.getElementById('f-rate').value = '320';
  }
  updateNights();
}

function onCurrencyChange() {
  const sel = document.getElementById('f-currency');
  const opt = sel.options[sel.selectedIndex];
  const rate = parseFloat(opt.getAttribute('data-rate')) || 1;
  document.getElementById('f-rate').value = rate;
  recalcFromUSD();
}

function recalcFromUSD() {
  const usdVal = parseFloat(document.getElementById('f-price-usd').value) || 0;
  const rateField = document.getElementById('f-rate');
  const sel = document.getElementById('f-currency');
  const opt = sel.options[sel.selectedIndex];
  if (!rateField.value) rateField.value = parseFloat(opt.getAttribute('data-rate')) || 1;
  const rate = parseFloat(rateField.value) || 1;
  const currency = sel.value;
  const converted = usdVal * rate;
  document.getElementById('f-price').value = usdVal > 0 ? usdVal.toFixed(2) : '';
  updateConvertedDisplay(usdVal, converted, currency, rate);
  updateNights();
}

function recalcFromRate() {
  const usdVal = parseFloat(document.getElementById('f-price-usd').value) || 0;
  const rate = parseFloat(document.getElementById('f-rate').value) || 1;
  const currency = document.getElementById('f-currency').value;
  updateConvertedDisplay(usdVal, usdVal * rate, currency, rate);
}

function syncUSDField() {
  const v = parseFloat(document.getElementById('f-price').value) || 0;
  document.getElementById('f-price-usd').value = v > 0 ? v.toFixed(2) : '';
  recalcFromUSD();
}

function updateConvertedDisplay(usd, converted, currency, rate) {
  const el = document.getElementById('converted-display');
  const nights = (() => {
    const ci = document.getElementById('f-checkin').value;
    const co = document.getElementById('f-checkout').value;
    return (ci && co && co > ci) ? daysBetween(ci, co) : 0;
  })();
  if (usd > 0) {
    let txt = `$${usd.toFixed(2)} USD/night`;
    if (currency !== 'USD') txt += ` = ${currency} ${converted.toLocaleString(undefined,{maximumFractionDigits:2})}/night`;
    if (nights > 0) {
      txt += ` &nbsp;·&nbsp; Total: $${(usd*nights).toFixed(2)} USD`;
      if (currency !== 'USD') txt += ` / ${currency} ${(converted*nights).toLocaleString(undefined,{maximumFractionDigits:2})}`;
    }
    el.style.display = 'block';
    el.innerHTML = txt;
  } else { el.style.display = 'none'; }
}

// ═══════════════════════════════════════════════════════
//  DOWNLOAD INVOICE AS PDF (works on mobile, unlike relying
//  solely on window.print() which many mobile browsers /
//  in-app webviews don't handle well)
// ═══════════════════════════════════════════════════════
let currentInvoiceId = null;
function downloadInvoicePDF() {
  const el = document.getElementById('print-area');
  if (!el || !el.innerHTML.trim()) return;
  const b = bookings.find(x => x.id === currentInvoiceId);
  const invNum = (b && b.invNum) ? 'CV-' + String(b.invNum).padStart(3, '0') : 'invoice';
  const guestPart = b ? b.guestName.replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '') : 'guest';
  const filename = `${invNum}-${guestPart}.pdf`;

  const btn = document.getElementById('download-pdf-btn');
  const originalLabel = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '⏳ Generating...';

  // Force a fixed desktop-style width during capture so the exported PDF always
  // uses the full multi-column invoice layout, even when this is triggered from
  // a narrow mobile screen (where the on-screen mobile CSS would otherwise stack
  // the fields into a single column and throw off the A4 sizing/alignment).
  const CAPTURE_WIDTH = 780; // px, matches the invoice's normal desktop width
  const prevWidth = el.style.width;
  const prevMaxWidth = el.style.maxWidth;
  el.style.width = CAPTURE_WIDTH + 'px';
  el.style.maxWidth = CAPTURE_WIDTH + 'px';

  const opt = {
    margin: [8, 8, 8, 8],
    filename: filename,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', width: CAPTURE_WIDTH, windowWidth: CAPTURE_WIDTH },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
  };

  const restoreWidth = () => { el.style.width = prevWidth; el.style.maxWidth = prevMaxWidth; };

  if (typeof html2pdf === 'undefined') {
    // Fallback if the PDF library failed to load (e.g. offline) — use print dialog instead
    restoreWidth();
    btn.disabled = false;
    btn.innerHTML = originalLabel;
    alert('PDF library could not load (check your internet connection). Opening print dialog instead — choose "Save as PDF" there.');
    window.print();
    return;
  }

  html2pdf().set(opt).from(el).save().then(() => {
    restoreWidth();
    btn.disabled = false;
    btn.innerHTML = originalLabel;
    addAudit('download_invoice', `Downloaded PDF invoice for ${b ? b.guestName : ''}`, '📥');
  }).catch(err => {
    console.error('PDF generation failed:', err);
    restoreWidth();
    btn.disabled = false;
    btn.innerHTML = originalLabel;
    alert('Could not generate the PDF. Please try the Print button instead.');
  });
}

// ═══════════════════════════════════════════════════════
//  NUMBER TO WORDS
// ═══════════════════════════════════════════════════════
function numberToWords(num) {
  if (num === 0) return 'Zero';
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function convert(n) {
    if (n < 20) return ones[n];
    if (n < 100) return tens[Math.floor(n/10)] + (n%10 ? ' '+ones[n%10] : '');
    if (n < 1000) return ones[Math.floor(n/100)] + ' Hundred' + (n%100 ? ' '+convert(n%100) : '');
    if (n < 100000) return convert(Math.floor(n/1000)) + ' Thousand' + (n%1000 ? ' '+convert(n%1000) : '');
    return convert(Math.floor(n/100000)) + ' Lakh' + (n%100000 ? ' '+convert(n%100000) : '');
  }
  return convert(num);
}

// ═══════════════════════════════════════════════════════
//  EXPORT
// ═══════════════════════════════════════════════════════
function exportExcel() {
  const rows = [['Invoice#','Guest Name','Guest Type','Nationality','Passport/NIC','Phone','Email','Room','Room Type','Check-in','Check-out','Nights','Adults','Children','Meal Plan','Source','Rate/Night','Total','Currency','Exch Rate','Total Local','Payment Method','Notes','Status','Added By','Added Date']];
  bookings.sort((a,b) => a.checkIn.localeCompare(b.checkIn)).forEach(b => {
    const room = ROOMS.find(r => r.id === b.room) || { name: b.room, type: '' };
    const nights = daysBetween(b.checkIn, b.checkOut);
    const totalUSD = (parseFloat(b.price)||0) * nights;
    const totalLocal = totalUSD * (parseFloat(b.exchangeRate)||320);
    const invNum = b.invNum ? 'CV-'+String(b.invNum).padStart(3,'0') : '';
    rows.push([invNum, b.guestName, b.guestType==='local'?'Local':'Foreign', b.nationality||'', b.passport||'', b.phone||'', b.email||'', room.name, room.type, b.checkIn, b.checkOut, nights, b.adults||'', b.children||'', b.mealPlan||'', b.source||'', b.price, totalUSD.toFixed(2), b.currency||'LKR', b.exchangeRate||320, totalLocal.toFixed(2), b.paymentMethod||'', b.notes||'', getStatus(b), b.addedBy||'', (b.addedAt||'').split('T')[0]]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = `crystal-villa-bookings-${MONTHS[calMonth]}-${calYear}.csv`; a.click();
  URL.revokeObjectURL(url);
  addAudit('export', `Exported bookings to CSV`, '📊');
}

function exportAuditLog() {
  const rows = [['Timestamp','User','Username','Action','Detail']];
  auditLog.forEach(a => rows.push([a.ts, a.user, a.username, a.action, a.detail]));
  const csv = rows.map(r => r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'crystal-villa-audit-log.csv'; a.click();
  URL.revokeObjectURL(url);
}

function populateSelects() {
  const roomSel = document.getElementById('f-room');
  const filterSel = document.getElementById('filter-room');
  // Clear existing options except first
  while (roomSel.options.length > 1) roomSel.remove(1);
  while (filterSel.options.length > 1) filterSel.remove(1);
  ROOMS.forEach(r => {
    [roomSel, filterSel].forEach(sel => {
      const opt = document.createElement('option');
      opt.value = r.id; opt.textContent = `${r.name} (${r.type})`; sel.appendChild(opt);
    });
  });
}
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function daysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
function pad(n) { return String(n).padStart(2,'0'); }
function daysBetween(d1, d2) { return Math.max(0, Math.round((new Date(d2) - new Date(d1)) / 86400000)); }
function bookingOn(roomId, dateStr) { return bookings.find(b => b.room === roomId && b.checkIn <= dateStr && b.checkOut > dateStr); }
function getStatus(b) { const t = todayStr(); if (b.checkOut <= t) return 'past'; if (b.checkIn <= t) return 'active'; return 'upcoming'; }
function fmtDate(d) { if (!d) return ''; return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); }

// ═══════════════════════════════════════════════════════
//  CANCEL BOOKING
// ═══════════════════════════════════════════════════════
let cancelId = null;
function openCancelModal(id) {
  cancelId = id;
  document.getElementById('cancel-form-error').classList.remove('show');
  document.getElementById('cancel-form-error').textContent = '';
  document.getElementById('c-username').value = '';
  document.getElementById('c-password').value = '';
  document.getElementById('cancel-modal').classList.add('open');
  setTimeout(() => document.getElementById('c-username').focus(), 50);
}
function closeCancelModal() {
  cancelId = null;
  document.getElementById('cancel-modal').classList.remove('open');
}
function toggleCancelPasswordVisibility() {
  const inp = document.getElementById('c-password');
  if (inp.type === 'password') inp.type = 'text';
  else inp.type = 'password';
}
function confirmCancelBooking() {
  if (!cancelId) return;
  const username = (document.getElementById('c-username').value || '').trim().toLowerCase();
  const password = document.getElementById('c-password').value || '';
  const acc = getAccount(username);
  const errEl = document.getElementById('cancel-form-error');
  if (!acc) {
    errEl.textContent = 'Invalid username.';
    errEl.classList.add('show');
    return;
  }
  if (acc.password !== password) {
    errEl.textContent = 'Incorrect password.';
    errEl.classList.add('show');
    return;
  }
  const b = bookings.find(x => x.id === cancelId);
  if (!b) {
    errEl.textContent = 'Booking not found.';
    errEl.classList.add('show');
    return;
  }

  // Cancel logic: remove booking from availability (delete)
  addAudit('cancel_booking', `Cancelled booking for ${b.guestName} (${fmtDate(b.checkIn)} – ${fmtDate(b.checkOut)})`, '⛔');
  bookings = bookings.filter(x => x.id !== cancelId);
  saveBookings();

  closeCancelModal();
  renderCalendar();
  renderStats();
  if (document.getElementById('tab-bookings').style.display !== 'none') renderBookingList();
}

(async function init() {
  document.getElementById('inp-password').addEventListener('keydown', e => { if (e.key==='Enter') loginWithPassword(); });
  document.getElementById('inp-username').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('inp-password').focus(); });
  loadSavedCredentials();
  // Load extraUsers/bookings/etc from Firebase up front so login works for non-builtin accounts too.
  await loadData();
  const saved = loadSession();
  if (saved) {
    const acc = getAccount(saved);
    if (acc) doLogin(saved, acc);
  }
})();
